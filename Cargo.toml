[package]
name = "dig-session"
version = "0.9.0"
edition = "2021"
rust-version = "1.75"
description = "DIG session/keystore layer: unlock identity signing keys and inject signing primitives. Composes dig-keystore (encrypted key storage) + dig-identity (canonical BLS identity derivation) behind one curated, custody-safe facade."
license = "GPL-2.0-only"
repository = "https://github.com/DIG-Network/dig-session"
homepage = "https://github.com/DIG-Network/dig-session"
documentation = "https://docs.rs/dig-session"
readme = "README.md"
keywords = ["dig-network", "session", "keystore", "identity", "bls"]
categories = ["cryptography::cryptocurrencies"]
# Ship only the library surface to crates.io. Explicit allow-list because the
# repo also tracks CI workflow files and build artefacts that must NOT end up in
# the published tarball.
include = [
    "src/**/*.rs",
    "tests/**/*.rs",
    "SPEC.md",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE*",
]

[dependencies]
# Encrypted, per-scheme secret-key storage (unlock -> SignerHandle). crates.io only.
# Both features are REQUIRED, not optional. dig-keystore 0.8 split its surface
# into tiers so the DIG node can link it WITHOUT ever naming a user-key API (the
# #908 node/user-key boundary): `custody` gates `Keystore`, `SignerHandle` and
# `scheme::{KeyScheme, BlsSigning, L1WalletBls}`, and `hd-derivation` (which
# implies `custody`) gates `SignerHandle::expose_secret`. dig-session IS the
# user-side facade and needs BOTH — `expose_secret` is how `derive_profile_dek`
# reaches the identity scalar that is the frozen DEK's IKM (SPEC.md §5).
dig-keystore = { version = "0.13", features = ["custody", "hd-derivation"] }
# Canonical DIG identity BLS derivation (master_secret_key_from_seed +
# derive_identity_sk at m/12381'/8444'/9'/0', and per-profile
# derive_identity_sk_at at m/12381'/8444'/9'/{profile_ix}'). crates.io only.
dig-identity = { version = "0.7.1", features = ["bls"] }
# Memory hygiene: the derived-secret BYTE BUFFERS we own (the enrolled
# key's canonical bytes and the transient 32-byte extraction) are wrapped in
# `Zeroizing`, so they are wiped on drop. NOTE: the transient
# `chia_bls::SecretKey` scalars produced by dig-identity's derivation are a
# foreign type with no `Zeroize`/`Drop` impl and cannot be wiped in place;
# they are instead confined to the smallest scope and dropped immediately.
zeroize = "1.7"
thiserror = "1"
# BIP-39: the ONE place a recovery phrase is converted. Entropy <-> 24 English
# words, and `to_seed("")` (PBKDF2-HMAC-SHA512, 2048 rounds, EMPTY passphrase —
# the Chia convention) to expand entropy into the 64-byte master HD seed. This
# expansion is what makes a DIG phrase restore identically in Sage; deriving
# straight from the entropy silently forks the wallet (dig_ecosystem #1759).
# `zeroize` makes `Mnemonic` `Zeroize + ZeroizeOnDrop`, which MATTERS here: `expand_entropy` builds a
# `Mnemonic` on EVERY derivation, and its word indices are a complete copy of the account root — without
# the feature those copies accumulate un-wiped in memory. No other languages pulled in.
bip39 = { version = "2.2", features = ["zeroize"] }
# Per-profile DEK derivation. Versions pinned to MATCH dig-app's DEK construction
# (dig-app-core keystore/secrets.rs) byte-for-byte: HKDF-SHA256, RFC 5869. A
# different hkdf/sha2 major here would risk a different DEK and break at-rest
# back-compat (§5.1) for every already-sealed profile blob.
hkdf = "0.12"
sha2 = "0.10"
# Single source of truth for the frozen profile-DEK byte contract (DEK_SALT,
# IDENTITY_IKM_VERSION, PROFILE_DEK_LABEL, SYMMETRIC_KEY_LEN) — see SPEC.md.
dig-constants = "0.11.1"

[dev-dependencies]
dig-keystore = { version = "0.13", features = ["custody", "hd-derivation", "testing"] }
tempfile = "3"
hex = "0.4"
# Test-only: the INDEPENDENT reference derivation for the cross-implementation
# golden vector (`master_to_wallet_unhardened(..).derive_synthetic()` ->
# `StandardArgs::curry_tree_hash` -> bech32m). Never hand-roll a Chia address.
#
# Pinned to the 0.34 family the whole DIG on-chain line rides (dig_ecosystem
# #2610), matching dig-account, dig-did, dig-merkle and dig-wallet-backend.
#
# The `chia` UMBRELLA crate cannot be used here: chia-wallet-sdk 0.34 requires
# chia-bls/chia-puzzle-types ^0.36.1, and the umbrella publishes no 0.36 line at
# all (its versions jump 0.32 -> 0.42). Naming the umbrella would resolve a
# SECOND, incompatible chia-bls tree and the reference derivation below would
# stop type-checking against the SDK. So the two crates the test actually needs
# are named directly, at exactly the versions chia-wallet-sdk 0.34 resolves to —
# the same pattern dig-did uses.
chia-bls = "0.36.1"
chia-puzzle-types = "0.36.1"
# `default-features = false` is a guard, not a pruning: chia-wallet-sdk declares
# no `default` feature on either 0.30 or 0.34, so this changes nothing TODAY. It
# is kept so that an upstream release which adds one (networking/TLS are the
# likely candidates) cannot silently widen a test-only dependency.
chia-wallet-sdk = { version = "0.36", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
